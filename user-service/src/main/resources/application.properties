spring.application.name=USER-SERVICE

server.port=8081

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

security.jwt.access-token-expiry=${JWT_EXPIRY:PT30M}
security.jwt.private-key=${JWT_PRIVATE_KEY:}
security.jwt.public-key=${JWT_PUBLIC_KEY:}
security.internal.service-token=${INTERNAL_SERVICE_TOKEN:}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

messaging.kafka.user-lifecycle-topic=${KAFKA_USER_LIFECYCLE_TOPIC:user.lifecycle.v1}
outbox.publisher.batch-size=${OUTBOX_BATCH_SIZE:50}
outbox.publisher.initial-delay-ms=${OUTBOX_INITIAL_DELAY_MS:5000}
outbox.publisher.fixed-delay-ms=${OUTBOX_POLL_INTERVAL_MS:5000}
outbox.publisher.send-timeout=${OUTBOX_SEND_TIMEOUT:PT10S}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.healthcheck.enabled=true
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:true}
eureka.instance.ip-address=${EUREKA_INSTANCE_IP:127.0.0.1}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
