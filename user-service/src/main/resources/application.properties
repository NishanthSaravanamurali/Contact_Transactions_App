spring.application.name=USER-SERVICE

server.port=8081

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

security.jwt.access-token-expiry=${JWT_EXPIRY:PT30M}
security.jwt.private-key=${JWT_PRIVATE_KEY:}
security.jwt.public-key=${JWT_PUBLIC_KEY:}
security.internal.service-token=${INTERNAL_SERVICE_TOKEN:}

integration.transaction-service.base-url=${TRANSACTION_SERVICE_URL:http://TRANSACTIONMICROSERVICE}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.healthcheck.enabled=true
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:true}
eureka.instance.ip-address=${EUREKA_INSTANCE_IP:127.0.0.1}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
