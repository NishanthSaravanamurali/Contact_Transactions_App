spring.application.name=API-GATEWAY
server.port=8080

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.healthcheck.enabled=true

spring.cloud.gateway.server.webflux.routes[0].id=user-auth-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=user-profile-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/users/**

spring.cloud.gateway.server.webflux.routes[2].id=transaction-route
spring.cloud.gateway.server.webflux.routes[2].uri=lb://TRANSACTIONMICROSERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/money/**

spring.cloud.gateway.server.webflux.routes[3].id=contact-route
spring.cloud.gateway.server.webflux.routes[3].uri=lb://CONTACT-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/contacts/**

security.jwt.public-key=${JWT_PUBLIC_KEY:}
gateway.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.probes.enabled=true

# Notifications, including the base history route and long-lived SSE stream.
spring.cloud.gateway.server.webflux.routes[4].id=notification-route
spring.cloud.gateway.server.webflux.routes[4].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/notifications,/api/v1/notifications/**
