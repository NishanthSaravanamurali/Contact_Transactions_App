spring.application.name=notification-service
server.port=${NOTIFICATION_PORT:8084}

spring.datasource.url=${NOTIFICATION_DB_URL}
spring.datasource.username=${NOTIFICATION_DB_USERNAME}
spring.datasource.password=${NOTIFICATION_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

security.jwt.public-key=${JWT_PUBLIC_KEY:}
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${NOTIFICATION_KAFKA_GROUP:notification-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.allow.auto.create.topics=false
spring.kafka.listener.ack-mode=record
spring.kafka.listener.auto-startup=${NOTIFICATION_KAFKA_ENABLED:true}
spring.kafka.listener.missing-topics-fatal=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.max.block.ms=10000
notifications.kafka.payment-topic=${PAYMENT_COMPLETED_TOPIC:payments.completed.v1}
notifications.kafka.dead-letter-topic=${PAYMENT_DEAD_LETTER_TOPIC:payments.completed.v1.notification-dlt}

notifications.sse.timeout-ms=300000
notifications.sse.heartbeat-ms=15000
notifications.sse.max-per-user=5
notifications.sse.max-connections=1000

