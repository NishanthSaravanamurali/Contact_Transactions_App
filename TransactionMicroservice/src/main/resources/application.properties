spring.application.name=TransactionMicroservice
server.port=8083

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

security.jwt.public-key=${JWT_PUBLIC_KEY:}

# Enable Eureka; false conflicts with the settings below.
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

# Logical User Service name registered in Eureka.
integration.user-service.service-id=${USER_SERVICE_ID:USER-SERVICE}

# Logical Contact Service name registered in Eureka.
integration.contact-service.service-id=${CONTACT_SERVICE_ID:CONTACT-SERVICE}

# Secret used only for Transaction Service → User Service internal calls.
integration.user-service.internal-token=${INTERNAL_SERVICE_TOKEN:}

integration.internal.user-service-token=${INTERNAL_SERVICE_TOKEN:}

# User lifecycle events are consumed as raw JSON so malformed records can be
# routed to the DLT without losing their original value.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_USER_LIFECYCLE_GROUP:transaction-wallet-provisioner}
spring.kafka.consumer.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET:earliest}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.listener.ack-mode=record

messaging.kafka.user-lifecycle-topic=${KAFKA_USER_LIFECYCLE_TOPIC:user.lifecycle.v1}
messaging.kafka.user-lifecycle-dlt-topic=${KAFKA_USER_LIFECYCLE_DLT_TOPIC:user.lifecycle.v1.DLT}
messaging.kafka.wallet-provisioner-group-id=${KAFKA_USER_LIFECYCLE_GROUP:transaction-wallet-provisioner}
messaging.kafka.retry.interval-ms=${KAFKA_RETRY_INTERVAL_MS:2000}
messaging.kafka.retry.max-retries=${KAFKA_MAX_RETRIES:3}
