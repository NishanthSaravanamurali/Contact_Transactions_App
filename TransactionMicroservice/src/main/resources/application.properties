spring.application.name=TransactionMicroservice
server.port=8083

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

security.jwt.public-key=${JWT_PUBLIC_KEY:}

# Enable Eureka; false conflicts with the settings below.
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

# Logical User Service name registered in Eureka.
integration.user-service.service-id=${USER_SERVICE_ID:USER-SERVICE}

# Logical Contact Service name registered in Eureka.
integration.contact-service.service-id=${CONTACT_SERVICE_ID:CONTACT-SERVICE}

# Secret used only for Transaction Service → User Service internal calls.
integration.user-service.internal-token=${INTERNAL_SERVICE_TOKEN:}

integration.internal.user-service-token=${INTERNAL_SERVICE_TOKEN:}